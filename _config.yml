title: IMF UG
description: A SMPTE community for users and implementers of the Interoperable Master Format (IMF) standards
author: IMF UG
language: en
timezone: America/Los_Angeles

url: https://www.imfug.com/
root: /website/
permalink: :title/
pretty_urls:
  trailing_index: false

source_dir: source
public_dir: public
new_post_name: :title.md
default_layout: post
render_drafts: false
highlight:
  enable: false
prismjs:
  enable: false

per_page: 10

# category pages keep the WordPress addresses (/category/<slug>/)
category_dir: category
category_map:
  Announcement: announcement
  Events: events
  FAQ: faq
  Information: information
  Meetings: meetings
  Report: report
pagination_dir: page
theme: minimal

feed:
  type: atom
  path: atom.xml
  limit: 20

hero:
  title: Welcome to the IMF User Group!
  text: |
    The IMF UG is a member-led forum for users and implementers of the
    Interoperable Master Format (IMF) standard. It publishes best practices,
    organizes plugfests, collects requirements and much more. The UG holds
    regular hybrid meetings, which are open to members and guests.

    Questions? Email [info@imfug.com](mailto:info@imfug.com).
  buttons:
    What is IMF?: /explainer/
    Best practices: best-practices/
    Videos: https://www.youtube.com/@IMFUserGroup
    Join the UG: /join/


# icons under the sidebar description (supported: youtube, linkedin, email)
social:
  youtube: https://www.youtube.com/@IMFUserGroup
  linkedin: https://www.linkedin.com/company/imfug
  email: mailto:info@imfug.com

menu:
  About: /about/
  What is IMF?: /explainer/
  Meetings: /meetings/
  Events: /events/
  Best Practices: /best-practices/
  Plugfests: /plugfest/
  Resources:
    Videos: https://www.youtube.com/@IMFUserGroup
    Open Source: /open-source/
    Products and Services: /suppliers/
    Other Organizations: /other-organizations/
    Logo: /logo/
    Members area: https://groups.imfug.com/g/members
  Join: /join/


# lowercase heading ids, so links like #program resolve
marked:
  modifyAnchors: 1

# PDFs under source/assets/ are published at /wp-content/uploads/ instead (scripts/legacy-urls.js)
exclude:
  - assets/**/*.pdf

# old addresses (from the WordPress site) that forward to their new location
redirects:
  /TR/timecode-in-imf/: https://github.com/imfug/001-timecode-in-imf
  /TR/pkg-and-delivery/: https://github.com/imfug/002-pkg-and-delivery
  /TR/imsc-authoring/: https://github.com/imfug/003-imsc-authoring
  /TR/audio-track-files/: https://github.com/imfug/004-audio-track-files
  /documents/ams-2019-workshop-outcome/: /assets/2019/11/digital-preservation-with-imf-v1.pdf
  /home/: /
  /category/uncategorized/: /archives/
