title: IMF UG
subtitle: ''
description: A SMPTE community for users and implementers of the Interoperable Master Format (IMF) standards #ispeakimf
author: IMF UG
tagline: A SMPTE community for users and implementers of the Interoperable Master Format (IMF) standards
language: en
timezone: America/Los_Angeles

url: https://imfug.github.io/website
root: /website/
permalink: :title/
pretty_urls:
  trailing_index: false

source_dir: source
public_dir: public
new_post_name: :title.md
default_layout: post
render_drafts: false
highlight:
  enable: false
prismjs:
  enable: false

per_page: 10
pagination_dir: page
theme: minimal

feed:
  type: atom
  path: atom.xml
  limit: 20

# A value that is a mapping becomes an expandable group of sub-items (open by default)
menu:
  About: /about/
  What is IMF?: /explainer/
  Meetings: /meetings/
  Events: /events/
  Best Practices: /best-practices/
  Plugfests: /plugfest/
  Resources:
    Videos: https://www.youtube.com/@IMFUserGroup
    Open Source: /open-source/
    Products and Services: /suppliers/
    Other Organizations: /other-organizations/
    Logo: /logo/
    Members area: https://groups.imfug.com/g/members
  Join: /join/

# set to false to drop themes/minimal/source/css/style.css and see plain Bootstrap
custom_css: true

# lowercase heading ids, so links like #program resolve
marked:
  modifyAnchors: 1
